[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS AI Windows Assistant"
authors = ["Chowdary"]
edition = "2024"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
