<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071322"/>
      <stop offset="65%" stop-color="#020813"/>
      <stop offset="100%" stop-color="#000307"/>
    </radialGradient>

    <!-- Outer Glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#0077ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Center Reactor Plasma Glow -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#5cfaff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#0066ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#001533" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Center Glow -->
    <radialGradient id="coreCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d4faff"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </radialGradient>

    <!-- Neon Cyan Linear Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cfaff"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- High-tech Metallic Cyan Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14344d"/>
      <stop offset="50%" stop-color="#091e2e"/>
      <stop offset="100%" stop-color="#040d14"/>
    </linearGradient>

    <!-- Copper / Gold Induction Coil Gradient -->
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd000"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#d85200"/>
    </linearGradient>
  </defs>

